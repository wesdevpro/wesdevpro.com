name: Website Build Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: src

      # TODO(wesley): add a `- name: Lint / run: npm run lint` step and a
      # `nuxt generate` step here (the actual static deploy artifact) once
      # you've confirmed both pass locally — added in this session but not
      # verified against a working node/npm environment, so left out of the
      # CI gate rather than risk breaking it unverified.

      - name: Build
        run: npm run build
        working-directory: src
